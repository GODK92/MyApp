# 강조색은 초록 계열 하나만 사용한다. 라이트/다크는 사용자의 시스템 설정을 따른다.
[theme]
baseRadius = "0.75rem"
buttonRadius = "0.75rem"
font = "sans-serif"
showWidgetBorder = true

[theme.light]
primaryColor = "#1F8A5B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F5F3"
textColor = "#1B2420"
borderColor = "#DCE3DF"

[theme.dark]
primaryColor = "#3DBE84"
backgroundColor = "#111614"
secondaryBackgroundColor = "#1C2420"
textColor = "#E6ECE8"
borderColor = "#2C3631"
